<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PORTFOLIO_TITLE}} - Design Portfolio</title>
  <meta name="description" content="{{PORTFOLIO_DESCRIPTION}}">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Design System Tokens -->
  <link rel="stylesheet" href="assets/color-palette.css">
  <link rel="stylesheet" href="assets/typography.css">
  
  <!-- Layout -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --max-width: 1200px;
      --container-padding: 1.5rem;
      --nav-height: 4rem;
    }
    
    body {
      font-family: var(--font-family-body);
      background-color: var(--color-bg-secondary);
      color: var(--color-text-primary);
      line-height: var(--line-height-body);
      scroll-behavior: smooth;
    }
    
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; height: auto; display: block; }
    ul, ol { list-style: none; }
    
    /* Skip link */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 0;
      padding: 0.5rem 1rem;
      background: var(--color-accent-500);
      color: white;
      z-index: var(--z-toast);
      transition: top var(--duration-moderate) var(--ease-out);
    }
    .skip-link:focus { top: 0; }
    
    /* Navigation */
    .navbar {
      position: sticky;
      top: 0;
      height: var(--nav-height);
      background-color: var(--color-bg-primary);
      border-bottom: 1px solid var(--color-border-primary);
      z-index: var(--z-fixed);
      backdrop-filter: blur(10px);
    }
    
    .navbar-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 var(--space-lg);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .nav-brand {
      font-family: var(--font-family-heading);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: var(--color-text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }
    
    .nav-link {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--color-text-secondary);
      transition: color var(--duration-fast) var(--ease-out);
    }
    .nav-link:hover { color: var(--color-text-primary); }
    .nav-link.active { color: var(--color-accent-500); }
    
    /* Mobile menu toggle */
    .nav-toggle { display: none; background: none; border: none; cursor: pointer; }
    
    /* Hero Section */
    .hero-section {
      min-height: 90vh;
      background: var(--color-bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-5xl) var(--container-padding);
      position: relative;
      overflow: hidden;
    }
    
    .hero-gradient {
      position: absolute;
      top: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(6, 148, 163, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      z-index: -1;
    }
    
    .hero-content {
      max-width: var(--max-width);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }
    
    .hero-text { max-width: 600px; }
    
    .hero-badge {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: var(--color-accent-50);
      color: var(--color-accent-600);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }
    
    .hero-title { font-size: 3.75rem; line-height: 1.1; font-weight: 700; margin-bottom: 1.5rem; letter-spacing: -0.02em; }
    .hero-subtitle { font-size: 1.25rem; line-height: 1.6; color: var(--color-text-secondary); margin-bottom: 2rem; max-width: 500px; }
    
    .hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: var(--radius-lg);
      font-weight: 600;
      font-size: 0.875rem;
      transition: all var(--duration-moderate) var(--ease-out);
      cursor: pointer;
      border: none;
    }
    
    .btn-primary {
      background: var(--color-text-primary);
      color: white;
    }
    .btn-primary:hover { background: var(--color-primary-800); transform: translateY(-1px); }
    
    .btn-secondary {
      background: transparent;
      color: var(--color-text-primary);
      border: 1px solid var(--color-border-primary);
    }
    .btn-secondary:hover { background: var(--color-bg-tertiary); }
    
    .btn-outline {
      background: transparent;
      color: var(--color-accent-500);
      border: 1px solid var(--color-accent-500);
    }
    .btn-outline:hover { background: var(--color-accent-50); }
    
    .hero-visual {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }
    
    .visual-card {
      position: relative;
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border-primary);
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      max-width: 400px;
      width: 100%;
    }
    
    .visual-card::before {
      content: "";
      position: absolute;
      top: -1rem;
      left: -1rem;
      right: -1rem;
      bottom: -1rem;
      background: var(--gradient-accent);
      border-radius: inherit;
      z-index: -1;
      opacity: 0.5;
      transition: opacity var(--duration-slower) var(--ease-out);
    }
    .visual-card:hover::before { opacity: 0.7; }
    
    .visual-icon {
      width: 48px;
      height: 48px;
      background: var(--color-bg-tertiary);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      border: 1px solid var(--color-border-primary);
    }
    
    .visual-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
    .visual-desc { font-size: 0.875rem; color: var(--color-text-secondary); line-height: 1.5; }
    
    /* Section Header */
    .section-header {
      text-align: center;
      margin-bottom: 4rem;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .section-kicker {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: var(--color-accent-50);
      color: var(--color-accent-600);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
    
    .section-title { font-size: 2.25rem; line-height: 1.2; font-weight: 700; margin-bottom: 1rem; letter-spacing: -0.01em; }
    .section-desc { font-size: 1.125rem; color: var(--color-text-secondary); line-height: 1.6; }
    
    /* Sections */
    .portfolio-section {
      padding: var(--space-6xl) 0;
      background-color: var(--color-bg-secondary);
    }
    
    .portfolio-section.alt { background-color: var(--color-bg-primary); }
    
    .section-container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 var(--container-padding);
    }
    
    /* Grid */
    .grid-1 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
    
    .grid { display: grid; gap: 2rem; }
    
    /* Cards */
    .case-study-card {
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border-primary);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform var(--duration-moderate) var(--ease-out), box-shadow var(--duration-moderate) var(--ease-out);
    }
    
    .case-study-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }
    
    .card-image { height: 200px; background: var(--color-bg-tertiary); overflow: hidden; }
    .card-content { padding: 1.5rem; }
    .card-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
    .card-desc { font-size: 0.875rem; color: var(--color-text-secondary); line-height: 1.5; margin-bottom: 1rem; }
    .card-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    
    .tag {
      padding: 0.25rem 0.75rem;
      background: var(--color-bg-tertiary);
      color: var(--color-text-tertiary);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 500;
    }
    
    /* Two-column layout */
    .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start; }
    
    /* Typography sections */
    .type-specimen {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2rem;
      margin-bottom: 4rem;
    }
    
    .type-card { padding: 2rem; background: var(--color-bg-primary); border: 1px solid var(--color-border-primary); border-radius: var(--radius-xl); }
    .type-sample { font-size: 1rem; margin-bottom: 0.5rem; }
    .type-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-tertiary); }
    
    /* Color swatches */
    .color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1.5rem; }
    
    .color-swatch {
      padding: 2rem 1rem;
      border-radius: var(--radius-xl);
      border: 1px solid var(--color-border-primary);
      text-align: center;
    }
    .color-box {
      width: 60px;
      height: 60px;
      margin: 0 auto 1rem;
      border-radius: var(--radius-lg);
    }
    .color-name { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.25rem; }
    .color-value { font-family: var(--font-family-mono); font-size: 0.75rem; color: var(--color-text-tertiary); }
    
    /* Wireframes */
    .wireframe-container {
      background: #0f172a;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-2xl);
    }
    
    .wireframe-header {
      padding: 0.75rem 1rem;
      background: #1e293b;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .wireframe-dots {
      display: flex; gap: 0.375rem;
    }
    .dot { width: 0.375rem; height: 0.375rem; border-radius: 50%; background: #334159; }
    .dot.red { background: #ef4444; }
    .dot.yellow { background: #f59e0b; }
    .dot.green { background: #10b981; }
    
    .wireframe-content { padding: 2rem; min-height: 600px; background: #020617; }
    
    .wireframe-component {
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-md);
    }
    
    .wireframe-label { font-size: 0.75rem; font-weight: 600; color: var(--color-text-tertiary); margin-bottom: 0.5rem; }
    
    /* Footer */
    .footer {
      border-top: 1px solid var(--color-border-primary);
      padding: var(--space-5xl) 0;
      background: var(--color-bg-primary);
    }
    
    .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 3rem; margin-bottom: 3rem; }
    .footer-title { font-weight: 600; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1.5rem; color: var(--color-text-primary); }
    .footer-link { font-size: 0.875rem; color: var(--color-text-secondary); margin-bottom: 0.75rem; display: block; }
    .footer-link:hover { color: var(--color-text-primary); }
    
    .footer-bottom {
      padding-top: 2rem;
      border-top: 1px solid var(--color-border-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--color-text-tertiary);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .hero-content { grid-template-columns: 1fr; gap: 2rem; }
      .hero-title { font-size: 2.5rem; }
      .two-column { grid-template-columns: 1fr; gap: 2rem; }
      .nav-links { display: none; }
      .nav-toggle { display: block; }
      .section-header { margin-bottom: 2rem; }
      .section-title { font-size: 1.875rem; }
    }
    
    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-in { animation: fadeIn var(--duration-moderate) var(--ease-out) forwards; }
    
    .reduced-motion .animate-in { animation: none; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="nav-brand">{{BRAND_NAME}}</div>
      <div class="nav-links">
        {{NAV_LINKS}}
      </div>
      <button class="nav-toggle" aria-label="Toggle menu">
        <span style="display:block;width:24px;height:2px;background:var(--color-text-primary);border-radius:2px;"></span>
        <span style="display:block;width:24px;height:2px;background:var(--color-text-primary);margin-top:4px;border-radius:2px;"></span>
        <span style="display:block;width:24px;height:2px;background:var(--color-text-primary);margin-top:4px;border-radius:2px;"></span>
      </button>
    </div>
  </nav>
  
  <main id="main-content">
    {{PORTFOLIO_CONTENT}}
  </main>
  
  <footer class="footer">
    <div class="section-container">
      <div class="footer-grid">
        {{FOOTER_SECTIONS}}
      </div>
      <div class="footer-bottom">
        <span>{{FOOTER_COPYRIGHT}}</span>
        <span>Designed with Design Portfolio Automation</span>
      </div>
    </div>
  </footer>
</body>
</html>
